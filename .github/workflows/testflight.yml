name: Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showtracker-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["99851772", "108461578"]'), github.actor_id)
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build and sign the iOS app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo '::error::Set EXPO_TOKEN in the testflight environment before running this workflow.'
            exit 1
          fi
          ipa_path="$RUNNER_TEMP/ShowTracker.ipa"
          npx --yes eas-cli@27.10.0 build --platform ios --profile testflight \
            --local --non-interactive --output "$ipa_path"
          if [[ ! -f "$ipa_path" ]]; then
            echo '::error::Local EAS build did not produce ShowTracker.ipa.'
            exit 1
          fi

      - name: Upload to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ vars.ASC_TESTFLIGHT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_TESTFLIGHT_PRIVATE_KEY }}
        run: |
          if [[ -z "$ASC_KEY_ID" && -z "$ASC_PRIVATE_KEY" ]]; then
            echo 'Upload is pending a ShowTracker-only App Store Connect key.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_PRIVATE_KEY" ]]; then
            echo '::error::Configure both ASC_TESTFLIGHT_KEY_ID and ASC_TESTFLIGHT_PRIVATE_KEY.'
            exit 1
          fi

          umask 077
          upload_dir=$(mktemp -d "$RUNNER_TEMP/showtracker-upload.XXXXXX")
          trap 'rm -rf "$upload_dir"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$upload_dir/apple.p8"
          unset ASC_PRIVATE_KEY
          ipa_path="$RUNNER_TEMP/ShowTracker.ipa"
          unzip -p "$ipa_path" 'Payload/ShowTracker.app/Info.plist' > "$upload_dir/Info.plist"
          bundle_id=$(plutil -extract CFBundleIdentifier raw "$upload_dir/Info.plist")
          if [[ "$bundle_id" != 'com.ebrardushullovci.showtracker' ]]; then
            echo '::error::The archive does not contain the ShowTracker bundle.'
            exit 1
          fi
          app_version=$(plutil -extract CFBundleShortVersionString raw "$upload_dir/Info.plist")
          build_number=$(plutil -extract CFBundleVersion raw "$upload_dir/Info.plist")
          npx --yes eas-cli@27.10.0 env:pull production --non-interactive --path "$upload_dir/eas.env" >/dev/null
          convex_url=$(sed -n 's/^EXPO_PUBLIC_CONVEX_URL=//p' "$upload_dir/eas.env" | tr -d '"' | head -1)
          if [[ -z "$convex_url" ]] || ! unzip -p "$ipa_path" 'Payload/ShowTracker.app/main.jsbundle' | grep -aFq "$convex_url"; then
            echo '::error::The production Convex URL was not embedded in main.jsbundle.'
            exit 1
          fi
          # altool requires an issuer argument even with an individual key.
          xcrun altool --upload-app -f "$ipa_path" --type ios \
            --api-key "$ASC_KEY_ID" --api-issuer user --api-key-subject user \
            --p8-file-path "$upload_dir/apple.p8"
          printf 'Uploaded ShowTracker %s (%s) to App Store Connect for TestFlight processing.\n' \
            "$app_version" "$build_number" >> "$GITHUB_STEP_SUMMARY"
